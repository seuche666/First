name: Android-App bauen

# Bei jedem Merge auf main: APK bauen, signieren und als GitHub-Release bereitstellen.
# Bei Pull Requests: nur bauen und testen (die APK gibt es dann als Download unter "Artifacts").
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signierschlüssel aus den Repository-Secrets (siehe android/README.md):
      #   SIGNING_KEYSTORE_BASE64  – Keystore-Datei als Base64-Text
      #   SIGNING_PASSWORD         – Passwort des Keystores und des Schlüssels
      # Ohne Secrets: Bei Pull Requests wird nur unsigniert gebaut,
      # auf main bricht der Build ab (es wird nie eine unsignierte App veröffentlicht).
      - name: Signierschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_PASSWORD" -alias fahrtenbuch > /dev/null 2>&1; then
              echo "::error::Der Signierschlüssel lässt sich nicht öffnen. Bitte SIGNING_KEYSTORE_BASE64 und SIGNING_PASSWORD prüfen."
              exit 1
            fi
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "SIGNING_PASSWORD=$SIGNING_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Signierschlüssel aus den Secrets wird verwendet."
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Die Secrets SIGNING_KEYSTORE_BASE64 und SIGNING_PASSWORD fehlen. Ohne sie wird kein Release erstellt (siehe android/README.md)."
            exit 1
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Keine Signier-Secrets verfügbar – es wird nur eine unsignierte Test-APK gebaut."
          fi

      - name: Tests ausführen
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: APK umbenennen
        run: |
          mkdir -p out
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/Fahrtenbuch-$VERSION_NAME.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/Fahrtenbuch-$VERSION_NAME-unsigniert.apk"
          fi

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fahrtenbuch-${{ env.VERSION_NAME }}
          path: android/out/*.apk

      - name: GitHub-Release erstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "out/Fahrtenbuch-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Fahrtenbuch $VERSION_NAME" \
            --notes "Neue Version der Fahrtenbuch-App.

          **Installieren:** Unten bei *Assets* auf **Fahrtenbuch-$VERSION_NAME.apk** tippen, herunterladen und öffnen.
          Ein Update wird einfach über die alte Version installiert – deine Daten bleiben erhalten." \
            --latest
